name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Format
        run: ./gradlew spotlessCheck

      - name: Lint
        run: ./gradlew lint

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew assembleRelease

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: risco-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Keep the lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 7
