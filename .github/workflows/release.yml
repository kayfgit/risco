name: release

# Pushing a tag like v0.2.0 builds risco signed with the release key and publishes it as a GitHub
# release, with that version's CHANGELOG.md section as its notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || {
            echo "Tag $GITHUB_REF_NAME doesn't match versionName in app/build.gradle.kts"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Test
        run: ./gradlew lint test

      - name: Build, signed with the release key
        env:
          RISCO_KEYSTORE_BASE64: ${{ secrets.RISCO_KEYSTORE_BASE64 }}
          RISCO_KEYSTORE_PASSWORD: ${{ secrets.RISCO_KEYSTORE_PASSWORD }}
          RISCO_KEY_ALIAS: ${{ secrets.RISCO_KEY_ALIAS }}
        run: |
          export RISCO_KEYSTORE="$RUNNER_TEMP/risco-release.jks"
          echo "$RISCO_KEYSTORE_BASE64" | base64 -d > "$RISCO_KEYSTORE"
          ./gradlew assembleRelease
          rm "$RISCO_KEYSTORE"

      - name: Check it's signed with the release key, not a debug one
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "CN=risco" certs.txt
          ! grep -q "Android Debug" certs.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="risco-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" --title "risco $version" --notes-file notes.md
